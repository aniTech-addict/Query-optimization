services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: mongoose_optimizer_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: optimizer
      POSTGRES_PASSWORD: optimizer_secret
      POSTGRES_DB: mongoose_optimizer
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimizer -d mongoose_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
